name: Strato Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Zola
      uses: taiki-e/install-action@v2
      with:
        tool: zola@0.22.1

    - name: Build the Zola site
      run: zola build

    - name: Deploy via rsync over SSH
      run: |
        sshpass -p "$FTP_PASSWORD" rsync -az --delete --stats \
          --out-format="%f (%l bytes)" \
          -e "ssh -p $FTP_PORT -o StrictHostKeyChecking=no" \
          ./public/ "$FTP_USER@$FTP_DOMAIN:zola/"
      env:
        FTP_USER: ${{ secrets.FTP_USER }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        FTP_DOMAIN: ${{ secrets.FTP_DOMAIN }}
        FTP_PORT: ${{ secrets.FTP_PORT }}
